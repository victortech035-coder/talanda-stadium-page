<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | TALANTA STADIUM</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="auth-body">
    <a href="/login.html" class="back-home">← Back to login</a>

    <main class="auth-container">
        <div class="auth-brand">
            <span class="brand-mark">T</span>
            <h1>TALANTA <span>STADIUM</span></h1>
            <p>EXPERIENCE THE GAME. LIVE THE MOMENT.</p>
        </div>

        <form id="resetPasswordForm" class="auth-card">
            <span class="eyebrow">RESET PASSWORD</span>
            <h2>Update your password</h2>
            <p>Enter your new password below.</p>

            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">

            <label for="confirmNewPassword">Confirm password</label>
            <input id="confirmNewPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Repeat your password">

            <button class="btn btn-primary auth-submit" type="submit">
                Update Password
            </button>

            <p id="authMessage" class="auth-message" aria-live="polite"></p>
        </form>
    </main>

    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</body>

</html>
